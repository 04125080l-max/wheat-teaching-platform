  /* 独立窗口中的桌宠：默认居中（calc 定位，不依赖 transform，

    height: 224px;
  }
  .pet-hint {

  #petSettingsBtn {

    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 11px;
    border-radius: 999px;
    background: linear-gradient(135deg, #0D9488, #14b8a6);
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    border: none;
    cursor: pointer;
    box-shadow: 0 3px 0 #0b6e65, 0 5px 10px rgba(15, 23, 42, 0.18);
  }
  #petSettingsBtn:hover { filter: brightness(1.07); }
  #petSettingsBtn svg { width: 14px; height: 14px; }
